name: Release

# Pushing a tag like v0.2.0 builds soi 0.2.0 with GTK inside for Linux
# (amd64, arm64) and macOS (Apple Silicon), and publishes them as a GitHub
# release. Changes to the packaging, and runs by hand, only build them.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Makefile
      - scripts/**
      - data/**
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      # The tag says the version, whatever Cargo.toml has.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: VERSION=${GITHUB_REF_NAME#v} perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if 1 .. /^\[features\]/' Cargo.toml

      # The AppImage needs glibc 2.39 or newer: build on the oldest Ubuntu
      # with GTK 4.14.
      - name: Install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the AppImage
        run: make appimage

      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ runner.arch }}
          path: target/soi-*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      # The tag says the version, whatever Cargo.toml has.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: VERSION=${GITHUB_REF_NAME#v} perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if 1 .. /^\[features\]/' Cargo.toml

      # Xcode 16's install_name_tool can't edit Homebrew's newer libraries.
      - name: Use Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install GTK 4
        run: brew install gtk4 pkg-config librsvg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the app bundle
        # The cache may bring back a partial bundle, which isn't replaced.
        run: |
          rm -rf target/soi.app
          make bundle
          ditto -c -k --keepParent target/soi.app target/soi-macos-arm64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: target/soi-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "soi $GITHUB_REF_NAME" --generate-notes --verify-tag
