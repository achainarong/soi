name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Ubuntu 24.04 ships GTK 4.14, the oldest soi supports. soi runs on
    # amd64 and arm64.
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # Tests that need a display or local programs (fastfetch) are marked
      # #[ignore] and don't run here.
      - name: Tests
        run: cargo test
