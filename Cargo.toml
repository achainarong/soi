[package]
name = "soi"
version = "0.1.14"
edition = "2024"

[features]
# The display-dependent checks have their own main-thread test executable.
gui-tests = []

[[test]]
name = "gui"
path = "tests/gui.rs"
harness = false
required-features = ["gui-tests"]

[dependencies]
async-channel = "2"
base64 = "0.23"
directories = "6.0.0"
flate2 = "1"
glib-unix = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libc = "0.2"
png = "0.18"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-width = "0.2"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
vte = "0.15"

# `cargo run` stays quick to build but runs the terminal fast enough:
# dependencies fully optimized, soi itself lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
